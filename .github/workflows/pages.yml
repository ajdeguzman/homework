name: Build and deploy notebook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build site
        run: |
          mkdir -p _site/doc/notebooks
          jupyter nbconvert \
            --to html \
            --template classic \
            --execute doc/notebooks/breast-cancer-analysis.ipynb \
            --output breast-cancer-analysis.html \
            --output-dir _site \
            --ExecutePreprocessor.timeout=180
          cp index.html _site/index.html
          cp lime-pothole-classification.html _site/lime-pothole-classification.html
          cp doc/notebooks/breast-cancer-analysis.ipynb _site/doc/notebooks/
          cp doc/notebooks/lime_pothole_classification.ipynb _site/doc/notebooks/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
